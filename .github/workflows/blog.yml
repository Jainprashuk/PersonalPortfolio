name: Auto Blog Generator

on:
  schedule:
   - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The generator POSTs a new draft straight to the backend (MongoDB) as
      # status:draft. Nothing is committed to the repo and nothing is published
      # until a human approves it at /Admin/drafts. No repo write access needed.
      - name: Generate draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node scripts/generateBlog.js
